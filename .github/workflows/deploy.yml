# ────────────────────────────────────────────────────────────────────────────
# GitHub Actions — Deploy del Frontend (Next.js) en Cloudflare Pages
#
# Trigger: push a la rama main o disparo manual
# Método: build estático (next build → output: 'export') y deploy a Cloudflare Pages
#          usando Wrangler CLI directo con las credenciales de entorno.
#
# Secrets requeridos en GitHub → Settings → Secrets and variables → Actions:
#   CLOUDFLARE_API_TOKEN  : Token de API de Cloudflare con permisos de Pages (Cloudflare Pages: Edit)
#   CLOUDFLARE_ACCOUNT_ID : ID de tu cuenta Cloudflare
#
# Variables opcionales en GitHub → Settings → Secrets and variables → Actions → Variables:
#   NEXT_PUBLIC_PAYLOAD_URL : URL pública del backend (por defecto: https://admin.casanorden.com.ar)
# ────────────────────────────────────────────────────────────────────────────

name: 🚀 Deploy Frontend (Next.js) → Cloudflare Pages

on:
  push:
    branches:
      - main

  # Permite disparar el deploy manualmente desde la UI de GitHub
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build estático y deploy en Cloudflare Pages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Verificar configuración de Secrets
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "❌ ERROR: Falta el secreto CLOUDFLARE_API_TOKEN en el repositorio de GitHub."
            echo "Configúralo en: Settings -> Secrets and variables -> Actions -> New repository secret"
            exit 1
          fi
          if [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "❌ ERROR: Falta el secreto CLOUDFLARE_ACCOUNT_ID en el repositorio de GitHub."
            echo "Configúralo en: Settings -> Secrets and variables -> Actions -> New repository secret"
            exit 1
          fi
          echo "✅ Secretos de Cloudflare detectados correctamente."

      - name: Instalar dependencias
        run: npm ci

      - name: Build estático de Next.js
        run: npm run build
        env:
          # URL del backend Payload CMS en producción (usa variable o default)
          NEXT_PUBLIC_PAYLOAD_URL: ${{ vars.NEXT_PUBLIC_PAYLOAD_URL != '' && vars.NEXT_PUBLIC_PAYLOAD_URL || 'https://admin.casanorden.com.ar' }}
          PAYLOAD_URL: ${{ vars.NEXT_PUBLIC_PAYLOAD_URL != '' && vars.NEXT_PUBLIC_PAYLOAD_URL || 'https://admin.casanorden.com.ar' }}
          # Node.js necesita suficiente memoria para el build
          NODE_OPTIONS: '--max_old_space_size=4096'

      - name: Verificar que la carpeta out/ existe
        run: |
          if [ ! -d "out" ]; then
            echo "❌ ERROR: La carpeta out/ no fue generada. Verificar next.config.mjs (output: 'export')."
            exit 1
          fi
          echo "✅ Carpeta out/ encontrada con $(find out -name '*.html' | wc -l) páginas HTML."

      - name: Deploy en Cloudflare Pages con Wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages deploy out --project-name=casa-norden --branch=main --commit-dirty=true
